<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій каталог речей</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding-bottom: 90px;
}

/* Заголовок */
.header {
    padding: 16px 20px 8px;
}
.header-title {
    font-size: 24px;
    font-weight: 700;
}
.header-sub {
    font-size: 13px;
    color: #aaa;
}

/* Форма додавання */
.form {
    padding: 10px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.form input,
.form select {
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 10px;
    color: #fff;
    font-size: 14px;
}
.form-row {
    display: flex;
    gap: 8px;
}
.form-row > * {
    flex: 1;
}

/* Кнопки */
.btn {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-main {
    background: linear-gradient(90deg, #ff0000, #ff6600);
    color: #fff;
    box-shadow: 0 0 16px rgba(255, 80, 0, 0.5);
}
.btn-secondary {
    background: #181818;
    color: #eee;
    border: 1px solid #333;
}
.btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 8px rgba(255, 80, 0, 0.3);
}

/* Панель дій */
.actions {
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* Пошук */
.search-bar {
    padding: 0 20px 10px;
}
.search-bar input {
    width: 100%;
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 10px;
    color: #fff;
    font-size: 14px;
}

/* Список товарів */
.list {
    padding: 10px 20px 20px;
}
.card {
    background: #080808;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #222;
    display: flex;
    gap: 10px;
}
.card-img {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    background: #111;
    object-fit: cover;
}
.card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.card-title {
    font-size: 15px;
    font-weight: 600;
}
.card-meta {
    font-size: 12px;
    color: #aaa;
}
.card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.card-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
}

/* Статуси */
.status-use {
    background: rgba(0, 180, 80, 0.2);
    color: #4ade80;
}
.status-sale {
    background: rgba(255, 160, 0, 0.2);
    color: #fed7aa;
}
.status-reserve {
    background: rgba(120, 120, 255, 0.2);
    color: #a5b4fc;
}

/* Кнопки в картці */
.card-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
}
.card-actions .btn {
    font-size: 11px;
    padding: 6px 8px;
}

/* Навігація знизу */
.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #050505;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 11px;
    color: #888;
}
.nav-item.active {
    color: #fff;
}
.nav-dot {
    width: 4px;
    height: 4px;
    border-radius: 999px;
    margin-top: 3px;
    background: transparent;
}
.nav-item.active .nav-dot {
    background: #ff4b2b;
}
</style>
</head>
<body>

<div class="header">
    <div class="header-title">Мій каталог речей</div>
    <div class="header-sub">Фото, назва, ціна, категорія, розмір, статус, нагадування</div>
</div>

<div class="form">
    <input id="photoUrl" type="text" placeholder="Фото URL (необов'язково)">
    <input id="name" type="text" placeholder="Назва">
    <div class="form-row">
        <input id="price" type="number" placeholder="Ціна">
        <input id="size" type="text" placeholder="Розмір">
    </div>
    <div class="form-row">
        <input id="category" type="text" placeholder="Категорія">
        <select id="status">
            <option value="use">У використанні</option>
            <option value="sale">На продаж</option>
            <option value="reserve">Резерв</option>
        </select>
    </div>
    <input id="restockNote" type="text" placeholder="Нагадування про поповнення (наприклад: «Купити ще через 2 місяці»)">
    <button id="addBtn" class="btn btn-main">Додати товар</button>
</div>

<div class="actions">
    <button id="exportCsvBtn" class="btn btn-secondary">Експорт в Excel (CSV)</button>
    <button id="exportPdfBtn" class="btn btn-secondary">Експорт в PDF</button>
</div>

<div class="search-bar">
    <input id="searchInput" type="text" placeholder="Пошук по назві, категорії, статусу">
</div>

<div class="list" id="list"></div>

<div class="nav">
    <div class="nav-item active" data-tab="catalog">
        <span>Каталог</span>
        <div class="nav-dot"></div>
    </div>
    <div class="nav-item" data-tab="favorites">
        <span>Обране</span>
        <div class="nav-dot"></div>
    </div>
    <div class="nav-item" data-tab="filters">
        <span>Фільтри</span>
        <div class="nav-dot"></div>
    </div>
    <div class="nav-item" data-tab="sales">
        <span>Продажі</span>
        <div class="nav-dot"></div>
    </div>
    <div class="nav-item" data-tab="profile">
        <span>Профіль</span>
        <div class="nav-dot"></div>
    </div>
</div>

<script>
let items = [];
let favorites = new Set();
let currentTab = "catalog";

function getStatusLabel(status) {
    if (status === "use") return "У використанні";
    if (status === "sale") return "На продаж";
    if (status === "reserve") return "Резерв";
    return "Невідомо";
}
function getStatusClass(status) {
    if (status === "use") return "status-use";
    if (status === "sale") return "status-sale";
    if (status === "reserve") return "status-reserve";
    return "";
}

document.getElementById("addBtn").addEventListener("click", () => {
    const photoUrl = document.getElementById("photoUrl").value.trim();
    const name = document.getElementById("name").value.trim();
    const price = document.getElementById("price").value.trim();
    const size = document.getElementById("size").value.trim();
    const category = document.getElementById("category").value.trim();
    const status = document.getElementById("status").value;
    const restockNote = document.getElementById("restockNote").value.trim();

    if (!name) return;

    const item = {
        id: Date.now(),
        photoUrl,
        name,
        price,
        size,
        category,
        status,
        restockNote,
        date: new Date().toLocaleDateString("uk-UA")
    };
    items.push(item);
    renderList();
    clearForm();
});

function clearForm() {
    document.getElementById("photoUrl").value = "";
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("size").value = "";
    document.getElementById("category").value = "";
    document.getElementById("status").value = "use";
    document.getElementById("restockNote").value = "";
}

document.getElementById("searchInput").addEventListener("input", () => {
    renderList();
});

function renderList() {
    const listEl = document.getElementById("list");
    listEl.innerHTML = "";

    const query = document.getElementById("searchInput").value.trim().toLowerCase();

    let filtered = items;

    if (currentTab === "favorites") {
        filtered = filtered.filter(i => favorites.has(i.id));
    } else if (currentTab === "sales") {
        filtered = filtered.filter(i => i.status === "sale");
    }

    if (query) {
        filtered = filtered.filter(i =>
            (i.name || "").toLowerCase().includes(query) ||
            (i.category || "").toLowerCase().includes(query) ||
            getStatusLabel(i.status).toLowerCase().includes(query)
        );
    }

    filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.className = "card-img";
        img.src = item.photoUrl || "https://via.placeholder.com/70x70/111111/555555?text=IMG";

        const body = document.createElement("div");
        body.className = "card-body";

        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = item.name;

        const meta1 = document.createElement("div");
        meta1.className = "card-meta";
        meta1.textContent = `Ціна: ${item.price || "—"} • Категорія: ${item.category || "—"} • Розмір: ${item.size || "—"}`;

        const meta2 = document.createElement("div");
        meta2.className = "card-meta";
        meta2.textContent = `Дата: ${item.date} • Нагадування: ${item.restockNote || "—"}`;

        const row = document.createElement("div");
        row.className = "card-row";

        const statusEl = document.createElement("div");
        statusEl.className = "card-status " + getStatusClass(item.status);
        statusEl.textContent = getStatusLabel(item.status);

        const favBtn = document.createElement("button");
        favBtn.className = "btn btn-secondary";
        favBtn.style.fontSize = "11px";
        favBtn.textContent = favorites.has(item.id) ? "У обраному" : "В обране";
        favBtn.addEventListener("click", () => {
            if (favorites.has(item.id)) favorites.delete(item.id);
            else favorites.add(item.id);
            renderList();
        });

        row.appendChild(statusEl);
        row.appendChild(favBtn);

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const duplicateBtn = document.createElement("button");
        duplicateBtn.className = "btn btn-secondary";
        duplicateBtn.textContent = "Дублювати";
        duplicateBtn.addEventListener("click", () => {
            const copy = { ...item, id: Date.now(), date: new Date().toLocaleDateString("uk-UA") };
            items.push(copy);
            renderList();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn btn-secondary";
        deleteBtn.textContent = "Видалити";
        deleteBtn.addEventListener("click", () => {
            items = items.filter(i => i.id !== item.id);
            favorites.delete(item.id);
            renderList();
        });

        actions.appendChild(duplicateBtn);
        actions.appendChild(deleteBtn);

        body.appendChild(title);
        body.appendChild(meta1);
        body.appendChild(meta2);
        body.appendChild(row);
        body.appendChild(actions);

        card.appendChild(img);
        card.appendChild(body);

        listEl.appendChild(card);
    });
}

/* Навігація */
document.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
        currentTab = el.getAttribute("data-tab");
        renderList();
    });
});

/* Експорт в CSV (Excel) */
document.getElementById("exportCsvBtn").addEventListener("click", () => {
    if (!items.length) return;
    const rows = [
        ["Назва", "Ціна", "Категорія", "Розмір", "Статус", "Дата", "Фото", "Нагадування"]
    ];
    items.forEach(i => {
        rows.push([
            i.name,
            i.price,
            i.category,
            i.size,
            getStatusLabel(i.status),
            i.date,
            i.photoUrl,
            i.restockNote
        ]);
    });
    const csv = rows.map(r => r.map(v => `"${(v || "").toString().replace(/"/g, '""')}"`).join(";")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "catalog.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});

/* Експорт в PDF (через друк) */
document.getElementById("exportPdfBtn").addEventListener("click", () => {
    window.print();
});

/* Початковий рендер */
renderList();
</script>

</body>
</html>
