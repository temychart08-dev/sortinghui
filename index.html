<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій каталог речей</title>
<style>
:root {
    --bg: #000;
    --bg-soft: #080808;
    --bg-card: #111;
    --text: #fff;
    --text-soft: #aaa;
    --accent: #ff4b2b;
    --accent-soft: #ff7b47;
    --border: #222;
}
body.light {
    --bg: #f5f5f5;
    --bg-soft: #ffffff;
    --bg-card: #ffffff;
    --text: #111;
    --text-soft: #666;
    --accent: #ff4b2b;
    --accent-soft: #ff7b47;
    --border: #ddd;
}
body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* Header */
.header {
    padding: 14px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header-title {
    font-size: 20px;
    font-weight: 700;
}
.header-sub {
    font-size: 12px;
    color: var(--text-soft);
}
.theme-toggle {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    background: var(--bg-soft);
    color: var(--text-soft);
    cursor: pointer;
}

/* Main */
.screen {
    padding: 8px 16px 80px;
}

/* Category buttons */
.category-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 8px;
}
.cat-btn {
    background: var(--bg-soft);
    border-radius: 14px;
    padding: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.cat-btn-title {
    font-size: 14px;
    font-weight: 600;
}
.cat-btn-sub {
    font-size: 11px;
    color: var(--text-soft);
}
.cat-btn:active {
    transform: scale(0.96);
    box-shadow: 0 0 12px rgba(0,0,0,0.3);
}

/* Main add button */
.main-add {
    margin-top: 14px;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent-soft));
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255,75,43,0.5);
}
.main-add:active {
    transform: scale(0.97);
    box-shadow: 0 0 10px rgba(255,75,43,0.3);
}

/* Form */
.form {
    margin-top: 10px;
    padding: 10px;
    background: var(--bg-soft);
    border-radius: 14px;
    border: 1px solid var(--border);
    display: none;
    flex-direction: column;
    gap: 8px;
}
.form-row {
    display: flex;
    gap: 8px;
}
.form-row > * {
    flex: 1;
}
.form input,
.form select,
.form textarea {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    font-size: 13px;
    color: var(--text);
}
.form textarea {
    min-height: 60px;
    resize: vertical;
}
.form-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
}
.btn {
    border-radius: 999px;
    border: none;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}
.btn-main {
    background: linear-gradient(90deg, var(--accent), var(--accent-soft));
    color: #fff;
}
.btn-secondary {
    background: var(--bg-card);
    color: var(--text-soft);
    border: 1px solid var(--border);
}

/* Category screen */
.cat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
}
.cat-title {
    font-size: 16px;
    font-weight: 600;
}
.cat-back {
    font-size: 12px;
    color: var(--text-soft);
    cursor: pointer;
}

/* Search */
.search-bar {
    margin-top: 8px;
}
.search-bar input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text);
}

/* Cards */
.list {
    margin-top: 10px;
}
.card {
    background: var(--bg-soft);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 8px;
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}
.card-img {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    background: var(--bg-card);
    object-fit: cover;
}
.card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.card-title {
    font-size: 14px;
    font-weight: 600;
}
.card-meta {
    font-size: 11px;
    color: var(--text-soft);
}
.card-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.card-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
}
.status-good {
    background: rgba(34,197,94,0.15);
    color: #4ade80;
}
.status-used {
    background: rgba(234,179,8,0.15);
    color: #fde68a;
}
.status-bad {
    background: rgba(248,113,113,0.15);
    color: #fecaca;
}
.card-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
}
.card-actions .btn {
    font-size: 11px;
    padding: 5px 8px;
}

/* Bottom nav */
.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-soft);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 6px 0;
}
.nav-item {
    font-size: 11px;
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
}
.nav-item.active {
    color: var(--accent-soft);
}
.nav-dot {
    width: 4px;
    height: 4px;
    border-radius: 999px;
    margin-top: 3px;
    background: transparent;
}
.nav-item.active .nav-dot {
    background: var(--accent-soft);
}
</style>
</head>
<body class="dark">

<div class="header">
    <div>
        <div class="header-title">Мій каталог речей</div>
        <div class="header-sub">Особистий застосунок-каталог, все під рукою</div>
    </div>
    <button id="themeToggle" class="theme-toggle">Темна</button>
</div>

<div id="mainScreen" class="screen">
    <div class="category-grid">
        <div class="cat-btn" data-cat="Кросівки">
            <div class="cat-btn-title">Кросівки</div>
            <div class="cat-btn-sub">Взуття, пари, бренди</div>
        </div>
        <div class="cat-btn" data-cat="Футболки">
            <div class="cat-btn-title">Футболки</div>
            <div class="cat-btn-sub">Базові, принти</div>
        </div>
        <div class="cat-btn" data-cat="Кофти">
            <div class="cat-btn-title">Кофти</div>
            <div class="cat-btn-sub">Худі, світшоти</div>
        </div>
        <div class="cat-btn" data-cat="Штани">
            <div class="cat-btn-title">Штани</div>
            <div class="cat-btn-sub">Карго, класика</div>
        </div>
        <div class="cat-btn" data-cat="Шорти">
            <div class="cat-btn-title">Шорти</div>
            <div class="cat-btn-sub">Літо, спорт</div>
        </div>
        <div class="cat-btn" data-cat="Куртки">
            <div class="cat-btn-title">Куртки</div>
            <div class="cat-btn-sub">Зима, демісезон</div>
        </div>
        <div class="cat-btn" data-cat="Джинси">
            <div class="cat-btn-title">Джинси</div>
            <div class="cat-btn-sub">Класика, relaxed</div>
        </div>
        <div class="cat-btn" data-cat="Носки">
            <div class="cat-btn-title">Носки</div>
            <div class="cat-btn-sub">Пари, запаси</div>
        </div>
        <div class="cat-btn" data-cat="Аксесуари">
            <div class="cat-btn-title">Аксесуари</div>
            <div class="cat-btn-sub">Кепки, ремені</div>
        </div>
    </div>

    <div id="openFormBtn" class="main-add">Додати товар</div>

    <div id="form" class="form">
        <input id="formName" type="text" placeholder="Назва">
        <input id="formCategory" type="text" placeholder="Категорія (наприклад: Кросівки)">
        <div class="form-row">
            <input id="formSize" type="text" placeholder="Розмір">
            <input id="formPrice" type="number" placeholder="Ціна">
        </div>
        <div class="form-row">
            <input id="formQty" type="number" placeholder="Кількість">
            <input id="formBrand" type="text" placeholder="Бренд">
        </div>
        <div class="form-row">
            <input id="formColor" type="text" placeholder="Колір">
            <select id="formState">
                <option value="good">Стан: відмінний</option>
                <option value="used">Стан: вживаний</option>
                <option value="bad">Стан: поганий</option>
            </select>
        </div>
        <input id="formPhoto" type="text" placeholder="Фото URL">
        <input id="formLink" type="text" placeholder="Посилання (якщо є)">
        <textarea id="formNotes" placeholder="Нотатки (наприклад: де купив, коли, особливості)"></textarea>
        <div class="form-actions">
            <button id="saveItemBtn" class="btn btn-main">Зберегти</button>
            <button id="cancelFormBtn" class="btn btn-secondary">Скасувати</button>
        </div>
    </div>
</div>

<div id="categoryScreen" class="screen" style="display:none;">
    <div class="cat-header">
        <div class="cat-title" id="catTitle"></div>
        <div class="cat-back" id="backBtn">Назад</div>
    </div>
    <div class="search-bar">
        <input id="searchInput" type="text" placeholder="Пошук по назві, бренду, розміру">
    </div>
    <div id="catList" class="list"></div>
</div>

<div class="nav">
